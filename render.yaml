services:
  - type: web
    name: maracanas-central-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: ER_AUTH_DB
        value: /tmp/maracanas-demo/auth.sqlite
      - key: DEMO_LOGIN
        value: demonstracao
      - key: DEMO_PASSWORD
        sync: false
